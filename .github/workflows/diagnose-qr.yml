name: diagnose QR delivery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect QR delivery on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          ssh_key=$(mktemp)
          trap 'rm -f "$ssh_key"' EXIT
          printf '%s\n' "$VPS_SSH_KEY" > "$ssh_key"
          ssh_opts=(-i "$ssh_key" -o IdentitiesOnly=yes -o UserKnownHostsFile=deploy/known_hosts -o StrictHostKeyChecking=yes)
          target="campus-deploy@$VPS_HOST"
          ssh "${ssh_opts[@]}" "$target" 'bash -se' <<'REMOTE'
          set -euo pipefail
          app_dir=/opt/campus
          compose=(docker compose --env-file "$app_dir/.env" -f "$app_dir/compose.prod.yaml")

          echo 'Container status:'
          "${compose[@]}" ps api bot postgres

          echo 'Recent QR delivery errors:'
          "${compose[@]}" logs --since 6h --tail 1000 bot 2>&1 \
            | grep -E 'qr_render_failed|outbox_delivery_failed|worker_failed' \
            | tail -100 || true

          echo 'Recent QR outbox rows:'
          "${compose[@]}" exec -T postgres psql -X -v ON_ERROR_STOP=1 -U campus -d campus <<'SQL'
          SELECT id, status, attempts, last_error, run_at, created_at,
                 payload->>'event_id' AS event_id,
                 payload->>'qr_display_id' AS qr_display_id
          FROM outbox
          WHERE kind = 'qr_display_start'
          ORDER BY id DESC
          LIMIT 10;

          SELECT id, event_id,
                 max_chat_id IS NOT NULL AS has_chat_destination,
                 max_user_id IS NOT NULL AS has_user_destination,
                 message_id IS NOT NULL AS has_message,
                 last_rendered_window, active_until, stopped_at, created_at
          FROM qr_displays
          ORDER BY id DESC
          LIMIT 10;
          SQL

          echo 'MAX image upload response shape (values redacted):'
          "${compose[@]}" exec -T bot python - <<'PY'
          import asyncio
          import os
          from collections.abc import Mapping, Sequence

          from campus.bot.workers.qr import qr_png
          from campus.max.client import MaxApiError
          from campus.max.http import HttpMaxClient
          from campus.max.types import UploadTarget


          def describe(value: object) -> None:
              print(f"json_type={type(value).__name__}")
              if not isinstance(value, Mapping):
                  if isinstance(value, Sequence) and not isinstance(value, (str, bytes)):
                      print(f"sequence_length={len(value)}")
                  return
              print(f"top_level_keys={sorted(str(key) for key in value)}")
              token = value.get("token")
              print(f"top_token_type={type(token).__name__} top_token_nonempty={bool(token)}")
              photos = value.get("photos")
              print(f"photos_type={type(photos).__name__}")
              if isinstance(photos, Mapping):
                  print(f"photos_count={len(photos)}")
                  first = next(iter(photos.values()), None)
              elif isinstance(photos, Sequence) and not isinstance(photos, (str, bytes)):
                  print(f"photos_count={len(photos)}")
                  first = photos[0] if photos else None
              else:
                  first = None
              print(f"photo_entry_type={type(first).__name__}")
              if isinstance(first, Mapping):
                  print(f"photo_entry_keys={sorted(str(key) for key in first)}")
                  nested = first.get("token")
                  print(
                      f"photo_token_type={type(nested).__name__} "
                      f"photo_token_nonempty={bool(nested)}"
                  )


          async def main() -> None:
              client = HttpMaxClient(
                  os.environ["MAX_BOT_TOKEN"],
                  base_url=os.environ["MAX_API_BASE_URL"],
                  max_attempts=1,
              )
              try:
                  target = UploadTarget.model_validate(
                      await client._request("POST", "/uploads", params={"type": "image"})
                  )
                  response = await client._uploads.post(
                      target.url,
                      files={"data": ("probe.png", qr_png("https://example.invalid"), "image/png")},
                  )
                  print(f"http_status={response.status_code}")
                  print(f"content_type={response.headers.get('content-type', '').split(';', 1)[0]}")
                  print(f"content_length={len(response.content)}")
                  try:
                      describe(response.json())
                  except ValueError:
                      print("json_type=invalid")
                  try:
                      payload = await client.upload_image(content=qr_png("https://example.invalid"))
                  except MaxApiError as error:
                      known_messages = {
                          "upload returned malformed token data": "malformed_token",
                          "upload returned malformed photos data": "malformed_photos",
                          "upload did not return a token": "missing_token",
                      }
                      print("upload_image_result=error")
                      print(f"upload_image_method={error.method}")
                      print(f"upload_image_status={error.status_code}")
                      print(f"upload_image_category={known_messages.get(error.message, 'other')}")
                  else:
                      print("upload_image_result=success")
                      print(f"upload_payload_has_photos={payload.photos is not None}")
                      print(f"upload_payload_has_token={payload.token is not None}")
              finally:
                  await client.aclose()


          asyncio.run(main())
          PY
          REMOTE
