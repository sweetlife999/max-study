[project]
name = "campus"
version = "0.1.0"
description = "Campus: onboarding, activities and rotating-QR check-in for MAX"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "segno>=1.6.6",
    "sqlalchemy[asyncio]>=2.0.54",
    "tzdata>=2026.1",
    "uvicorn>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
    "testcontainers[postgres]>=4.15.0",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = ["--strict-markers", "--strict-config", "-ra"]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["campus"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "\\.\\.\\.$",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "S", "SIM", "RUF", "ASYNC", "C4", "DTZ", "PT", "RET", "TID", "PL",
]
ignore = [
    "PLR0913", # services legitimately take several keyword arguments
    "PLR2004", # magic values are fine in tests; production code uses named constants
    "RUF001", "RUF002", "RUF003", # Cyrillic text is intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR0915", "PLC0415"]
"alembic/**" = ["N999"]

[tool.pyright]
include = ["src", "tests", "alembic"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
strict = ["src/campus/domain"]
venvPath = "."
venv = ".venv"
