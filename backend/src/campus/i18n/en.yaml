# English texts. Keys must match ru.yaml exactly (a test enforces it).
# Only domain error messages live here; bot and mini-app copy come with their own branches.
# A key is an error's `message_key`, not its wire code: several errors share one code from the
# closed list of §7 while speaking to the user differently.
errors:
  domain_error: "Something went wrong. Please try again."
  validation_error: "Please check the data you entered."
  unknown_event_kind: "That activity kind is not configured for your university."
  unknown_onboarding_step: "That onboarding step does not exist or is not completed manually."
  invalid_time_range: "An event must end after it starts."
  unsupported_language: "That language is not supported yet."
  step_not_manual: "This step is completed by checking in at an event, not by hand."
  invalid_init_data: "We could not verify the launch data. Please reopen the app."
  consent_required: "Please give your consent to data processing to continue."
  not_organizer: "Only organizers can do this."
  admin_required: "Only administrators can do this."
  not_owner: "Only the organizer of this event can manage it."
  checkin_closed: "Check-in for this event is closed right now."
  checkin_not_started: "Check-in opens closer to the start of the event."
  checkin_window_over: "Check-in for this event has already closed."
  user_not_found: "User not found."
  event_not_found: "Event not found."
  step_not_found: "Onboarding step not found."
  invite_invalid: "Invitation not found or no longer valid."
  qr_display_not_found: "QR display not found."
  invite_expired: "This invitation has expired."
  invite_used: "This invitation has already been used."
  invalid_code: "That code is not valid."
  code_expired: "That code has expired. Please scan the QR again."
  ambiguous_code: "This code matches several events — please pick one."
  rate_limited: "Too many attempts. Please try again in a few minutes."
  configuration_error: "The service is misconfigured. Please tell the organizers."
